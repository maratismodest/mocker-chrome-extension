<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
body { gap: 40px; padding: 0 56px; }
.left { flex: 1; display: flex; flex-direction: column; gap: 28px; }
h1 { font-size: 44px; margin-bottom: 0; }
.window { background: #fff; color: #0f172a; border-radius: 12px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
.bar { background: #e2e8f0; padding: 12px 16px; display: flex; align-items: center; gap: 8px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: #f87171; }
.dot:nth-child(2) { background: #fbbf24; } .dot:nth-child(3) { background: #4ade80; }
.url { margin-left: 12px; flex: 1; background: #fff; border-radius: 6px; padding: 6px 12px; font-size: 15px; color: #475569; }
.page { padding: 24px 28px; }
.page h2 { font-size: 24px; margin-bottom: 16px; }
table { width: 100%; border-collapse: collapse; font-size: 17px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #e2e8f0; }
th { color: #64748b; font-weight: 600; font-size: 14px; text-transform: uppercase; }
.net { margin-top: 18px; font-size: 15px; background: #f1f5f9; border-radius: 8px; padding: 10px 14px; display: flex; justify-content: space-between; }
.net b { color: #16a34a; }
.popup { width: 440px; height: 520px; }
</style></head><body>
<div class="left">
    <h1>Your JSON, returned on any site</h1>
    <div class="window">
        <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">localhost:3000/users</span></div>
        <div class="page">
            <h2>Users</h2>
            <table>
                <tr><th>ID</th><th>Name</th><th>Role</th></tr>
                <tr><td>1</td><td>John Doe</td><td>admin</td></tr>
                <tr><td>2</td><td>Jane Smith</td><td>editor</td></tr>
                <tr><td>3</td><td>Jane Austen</td><td>viewer</td></tr>
            </table>
            <div class="net"><code>GET /api/users</code><b>mocked · 200</b></div>
        </div>
    </div>
</div>
<iframe class="popup" src="popup.html?scene=2"></iframe>
</body></html>
